[package]
name = "scrm-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A cdylib because Python imports a shared object. This crate holds BINDINGS AND NO LOGIC: the
# logic is in scrm-pack, exercised by `cargo test` with no Python in the loop.
[lib]
name = "scrm_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
scrm-core.workspace = true
scrm-pack.workspace = true
# scrm-asm SOLELY to re-export `resolution_name()`, as a BINDING and no logic: the string is
# computed in Rust from the consensus constants and exposed to Python as-is, so Python reads the
# molecule definition the current code produces. A path dependency because scrm-asm is not in
# [workspace.dependencies].
scrm-asm = { path = "../scrm-asm" }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }
numpy.workspace = true
