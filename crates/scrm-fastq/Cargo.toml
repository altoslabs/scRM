[package]
name = "scrm-fastq"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
paraseq.workspace = true
# Not optional and not feature-gated: there is one decode path, so there is one build.
rapidgzip-core.workspace = true
# Sibling crates by path: the workspace manifest declares only `scrm-core`
# under [workspace.dependencies].
scrm-chem = { path = "../scrm-chem" }
scrm-core.workspace = true
scrm-trim = { path = "../scrm-trim" }
thiserror.workspace = true

[dev-dependencies]
# Only to *write* gzip fixtures in tests. The library does not read gzip through flate2.
flate2.workspace = true
proptest.workspace = true

[[example]]
name = "validate"
